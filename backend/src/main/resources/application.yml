spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/claims}
    username: ${DB_USER:claims}
    password: ${DB_PASSWORD:claims-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

# Local demo login only. Set DEMO_PASSWORD to change it.
app:
  demo-password: ${DEMO_PASSWORD:demo-local}
