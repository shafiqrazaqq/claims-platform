spring:
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:14330;databaseName=claimsdb;encrypt=true;trustServerCertificate=true}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

# Local demo login only. Set DEMO_PASSWORD to change it.
app:
  demo-password: ${DEMO_PASSWORD:demo-local}
