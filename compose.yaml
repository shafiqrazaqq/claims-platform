# Local use only. Set ACCEPT_EULA=Y to accept Microsoft's licence terms, and DB_PASSWORD to a strong password.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:?Set ACCEPT_EULA=Y after reading the licence terms}
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "127.0.0.1:14330:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'select 1'"]
      interval: 5s
      retries: 30

  # Creates the database. SQL Server has no setting for it.
  create-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    entrypoint: ["/bin/bash", "-c"]
    command: ["/opt/mssql-tools18/bin/sqlcmd -C -b -S db -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"if db_id('claimsdb') is null create database claimsdb\""]
