# Local use only. Port 5433 avoids a clash with an installed PostgreSQL.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: claims
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: claims-local
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims"]
      interval: 3s
      retries: 20
